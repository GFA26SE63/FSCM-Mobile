name: fscm_mobile
description: >-
  FSCM mobile app (FA26SE083, team GFA26SE63) - one Flutter app, role-based:
  Sales, Warehouse Keeper, Retailer. Offline-first order taking with FEFO-aware backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local storage (SQLite cache + offline order queue)
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Device features
  mobile_scanner: ^5.2.3

  # Utils
  uuid: ^4.5.1
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
