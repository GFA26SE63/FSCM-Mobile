name: fscm_mobile
description: >-
  FSCM mobile app (FA26SE083, team GFA26SE63) - one Flutter app, role-based:
  Sales, Warehouse Keeper, Retailer. Offline-first order taking with FEFO-aware backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Network
  dio: ^5.11.0
  graphql_flutter: ^5.3.0
  connectivity_plus: ^7.3.1

  # Local storage (SQLite cache + offline order queue)
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1

  # Device features
  mobile_scanner: ^5.2.3
  workmanager: ^0.10.6
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

  # Utils
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  intl: ">=0.19.0 <0.21.0"
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
